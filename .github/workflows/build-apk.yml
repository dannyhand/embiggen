# Save as .github/workflows/build-apk.yml in dannyhand/embiggen
name: Build Android APK

on:
  workflow_dispatch        # "Run workflow" button (works from the GitHub app)
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      # Point Bubblewrap at the runner's JDK and Android SDK so it
      # doesn't stop to ask whether it should download its own.
      - name: Configure Bubblewrap
        run: |
          SDK="$ANDROID_HOME"
          sudo ln -sfn "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json

      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore

      - name: Generate and build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - name: Rename outputs
        working-directory: android
        run: |
          VERSION=$(jq -r .appVersionName twa-manifest.json)
          mv app-release-signed.apk "embiggen-v$VERSION.apk"
          mv app-release-bundle.aab "embiggen-v$VERSION.aab"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: embiggen-v${{ env.VERSION }}-android
          path: |
            android/embiggen-v${{ env.VERSION }}.apk
            android/embiggen-v${{ env.VERSION }}.aab
            
