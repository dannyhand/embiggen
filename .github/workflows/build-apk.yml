# .github/workflows/build-apk.yml  (Capacitor version: web files bundled inside the APK)
name: Build Android APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read version
        run: |
          echo "VERSION=$(jq -r .versionName version.json)" >> "$GITHUB_ENV"
          echo "CODE=$(jq -r .versionCode version.json)" >> "$GITHUB_ENV"

      # Copy the web app into cap-build/www. sw.js is left out on purpose:
      # the files are already local, and a cache-first service worker could
      # keep serving old files after you install an updated APK.
      - name: Prepare web files
        run: |
          mkdir -p cap-build/www
          rsync -a \
            --exclude '.*' --exclude 'android' --exclude 'cap-build' \
            --exclude 'node_modules' --exclude 'sw.js' --exclude 'version.json' \
            --exclude 'README.md' --exclude 'LICENSE' \
            ./ cap-build/www/

      - name: Create Capacitor project
        working-directory: cap-build
        run: |
          npm init -y > /dev/null
          npm i @capacitor/core@^7 @capacitor/android@^7
          npm i -D @capacitor/cli@^7 @capacitor/assets
          npx cap init "Embiggen" us.dannyhand.embiggen --web-dir www
          npx cap add android

      - name: Generate app icons
        working-directory: cap-build
        run: |
          mkdir -p assets
          cp www/icons/icon-512.png assets/icon-only.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#000000'

      - name: Set version
        working-directory: cap-build/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" build.gradle
          grep -E 'versionCode|versionName' build.gradle

      - name: Build unsigned APK and AAB
        working-directory: cap-build/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign
        working-directory: cap-build/android/app/build/outputs
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/android.keystore"
          KS="$RUNNER_TEMP/android.keystore"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p "$GITHUB_WORKSPACE/out"

          "$BT/zipalign" -p -f 4 apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias android \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/out/embiggen-v$VERSION.apk" "$RUNNER_TEMP/aligned.apk"

          cp bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/embiggen-v$VERSION.aab"
          jarsigner -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            "$GITHUB_WORKSPACE/out/embiggen-v$VERSION.aab" android

          rm -f "$KS"

      - uses: actions/upload-artifact@v4
        with:
          name: embiggen-v${{ env.VERSION }}
          path: out/
